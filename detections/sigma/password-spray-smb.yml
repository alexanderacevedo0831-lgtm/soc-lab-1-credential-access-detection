title: Possible SMB Password Spray From Single Source
id: 6f3a2c1e-8b4d-4e2a-9c7f-1a2b3c4d5e01
status: experimental
description: Detects failed network logons against multiple distinct accounts from one source IP in a short window, consistent with password spraying.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Alexander Acevedo
date: 2026-11-03
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    LogonType: 3
  condition: selection | count(TargetUserName) by IpAddress > 2
timeframe: 10m
falsepositives:
  - Misconfigured services or scripts using stale credentials across accounts
  - Vulnerability scanners performing authenticated checks
level: medium
